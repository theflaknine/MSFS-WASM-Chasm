name: build

on:
  push:
    branches: [ main, 'claude/**' ]
    tags: [ 'v*' ]
  workflow_dispatch:

# Nothing gets write access by default. Only the release job below asks for it, and only for a version tag.
# Actions are pinned to exact commits, because a tag such as v4 can be moved. The comment gives the tag.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x

      - name: Compile CRT pixel shader
        shell: pwsh
        run: |
          $fxc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter fxc.exe |
                 Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $fxc) { Write-Warning "fxc.exe not found; the app will use overlay-only CRT effects."; exit 0 }
          & $fxc.FullName /nologo /T ps_2_0 /E main /Fo src/WasmChasm.App/Shaders/crt.ps src/WasmChasm.App/Shaders/crt.fx
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test
        run: dotnet test tests/WasmChasm.Tests -c Release --logger "console;verbosity=normal"

      - name: Publish app (one exe, .NET Framework 4.8, x64)
        run: dotnet publish src/WasmChasm.App -c Release -o artifacts/app

      - name: Package and checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item artifacts/app/WasmChasm.exe release/
          Copy-Item data/locations.json release/
          Copy-Item LICENSE release/LICENSE.txt
          Copy-Item THIRD-PARTY-NOTICES.txt release/
          Copy-Item src/WasmChasm.App/Fonts/OFL.txt release/
          # One zip for users. The checksum file sits beside it, outside the zip, so the zip itself can be checked.
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path release/* -DestinationPath dist/wasm-chasm-win-x64.zip
          Get-ChildItem dist -File | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)"
          } | Set-Content dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wasm-chasm-win-x64
          path: dist/

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write     # to create the draft release
      id-token: write     # to sign the attestation
      attestations: write # to store the attestation
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wasm-chasm-win-x64
          path: dist

      # Lets anyone prove the exe was built here from this source: gh attestation verify wasm-chasm-win-x64.zip -R theflaknine/MSFS-WASM-Chasm
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/wasm-chasm-win-x64.zip

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          draft: true
